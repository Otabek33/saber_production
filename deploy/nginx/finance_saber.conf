# nginx site for finance_saber. Replace finance.example.uz with your domain, then:
#   sudo certbot certonly --nginx -d finance.example.uz   # free HTTPS certificate (Let's Encrypt), first
#   sudo cp deploy/nginx/finance_saber.conf /etc/nginx/sites-available/finance_saber
#   sudo ln -s /etc/nginx/sites-available/finance_saber /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# certbot renews the certificate by itself (systemctl list-timers | grep certbot).

upstream finance_saber {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name finance.example.uz;

    # certbot answers its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finance.example.uz;

    # Written by certbot.
    ssl_certificate     /etc/letsencrypt/live/finance.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.example.uz/privkey.pem;

    # Excel workbooks are uploaded through the app (it rejects files over 20 MB).
    client_max_body_size 25m;

    access_log /var/log/nginx/finance_saber.access.log;
    error_log  /var/log/nginx/finance_saber.error.log;

    # Static files go through to WhiteNoise, which sets the right cache headers
    # (a year for hashed names, short for the rest) and serves the compressed copies.
    location / {
        proxy_pass http://finance_saber;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;  # matches gunicorn's timeout for slow imports
    }
}
