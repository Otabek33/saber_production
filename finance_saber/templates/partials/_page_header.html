{% load i18n %}
{% comment %}
  Page title card with breadcrumb.
  Usage: {% include "partials/_page_header.html" with title="Invoices" section="Sales" %}
{% endcomment %}
<div class="card card-body py-3">
  <div class="row align-items-center">
    <div class="col-12">
      <div class="d-sm-flex align-items-center justify-space-between">
        <h4 class="mb-4 mb-sm-0 card-title">{{ title }}</h4>
        <nav aria-label="breadcrumb" class="ms-auto">
          <ol class="breadcrumb">
            <li class="breadcrumb-item d-flex align-items-center">
              <a class="text-muted text-decoration-none d-flex" href="{% url 'core:home' %}" aria-label="{% translate "Dashboard" %}">
                <iconify-icon icon="solar:home-2-line-duotone" class="fs-6"></iconify-icon>
              </a>
            </li>
            {% if section %}<li class="breadcrumb-item">{{ section }}</li>{% endif %}
            <li class="breadcrumb-item" aria-current="page">
              <span class="badge fw-medium fs-2 bg-primary-subtle text-primary">{{ title }}</span>
            </li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>
